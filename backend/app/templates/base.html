<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HireMind AI — Intelligent Recruitment Assistant{% endblock %}</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fas fa-brain"></i>
                <span>HireMind <span class="badge bg-primary fs-6 fw-normal ms-1">AI</span></span>
            </div>
            <ul class="sidebar-nav">
                <li class="nav-item">
                    <a href="/" class="nav-link">
                        <i class="fas fa-th-large"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/jobs" class="nav-link">
                        <i class="fas fa-briefcase"></i>
                        <span>Job Openings</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/screening" class="nav-link">
                        <i class="fas fa-file-invoice"></i>
                        <span>Resume Screening</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/matching" class="nav-link">
                        <i class="fas fa-balance-scale"></i>
                        <span>JD Matching</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/interview" class="nav-link">
                        <i class="fas fa-comments"></i>
                        <span>Interview Studio</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="d-flex align-items-center gap-2 mb-1">
                    <span class="badge bg-success-subtle text-success p-1 rounded-circle"><i class="fas fa-circle fa-xs"></i></span>
                    <strong class="text-light small">AI Engine Active</strong>
                </div>
                <div class="text-secondary" style="font-size: 0.75rem;">
                    LangGraph • Groq • ChromaDB
                </div>
            </div>
        </aside>

        <!-- Main Content View -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
